name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --no-input

      - name: Run Django system checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.APP_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (immutable git-SHA tag)
        id: image
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          IMAGE_URI="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render taskdef.json from deploy/taskdef.template.json
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
          DJANGO_SECRET_KEY_ARN: ${{ secrets.DJANGO_SECRET_KEY_ARN }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export ACCOUNT_ID
          mkdir -p render
          envsubst < deploy/taskdef.template.json > render/taskdef.json
          cp deploy/appspec.yaml render/appspec.yaml

      - name: Zip deploy artifact
        run: |
          cd render
          zip -j ../artifacts.zip taskdef.json appspec.yaml

      - name: Upload deploy artifact to S3
        env:
          ARTIFACT_BUCKET_NAME: ${{ secrets.ARTIFACT_BUCKET_NAME }}
        run: |
          aws s3 cp artifacts.zip "s3://${ARTIFACT_BUCKET_NAME}/deploy-artifacts/artifacts.zip"

      - name: Push image (triggers EventBridge -> CodePipeline)
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: docker push "$IMAGE_URI"
