name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --no-input

      - name: Run Django system checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.APP_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (mutable :latest tag)
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: docker build -t "${ECR_REPOSITORY_URI}:latest" .

      - name: Zip deploy artifact
        run: zip -j artifacts.zip deploy/taskdef.json deploy/appspec.yaml deploy/migrate-buildspec.yml

      - name: Upload deploy artifact to S3
        env:
          ARTIFACT_BUCKET_NAME: ${{ secrets.ARTIFACT_BUCKET_NAME }}
        run: aws s3 cp artifacts.zip "s3://${ARTIFACT_BUCKET_NAME}/deploy-artifacts/artifacts.zip"

      - name: Push image (triggers EventBridge -> CodePipeline)
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: docker push "${ECR_REPOSITORY_URI}:latest"
