name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.APP_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (immutable git-SHA tag)
        id: image
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          IMAGE_URI="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Generate real taskdef.json
        id: taskdef
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
          DJANGO_SECRET_KEY_ARN: ${{ secrets.DJANGO_SECRET_KEY_ARN }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXEC_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ENVIRONMENT_NAME}-ecs-task-execution-role"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ENVIRONMENT_NAME}-ecs-task-role"
          LOG_GROUP="/ecs/${ENVIRONMENT_NAME}-todo-app"
          SSM_PREFIX="arn:aws:ssm:${AWS_REGION}:${ACCOUNT_ID}:parameter/${ENVIRONMENT_NAME}"

          mkdir -p render
          jq -n \
            --arg family "${ENVIRONMENT_NAME}-todo-app" \
            --arg image "$IMAGE_URI" \
            --arg execRoleArn "$EXEC_ROLE_ARN" \
            --arg taskRoleArn "$TASK_ROLE_ARN" \
            --arg dbSecretArn "$DB_SECRET_ARN" \
            --arg djangoSecretArn "$DJANGO_SECRET_KEY_ARN" \
            --arg dbProxyArn "${SSM_PREFIX}/db-proxy-endpoint" \
            --arg dbPortArn "${SSM_PREFIX}/db-port" \
            --arg dbNameArn "${SSM_PREFIX}/db-name" \
            --arg redisHostArn "${SSM_PREFIX}/redis-host" \
            --arg redisPortArn "${SSM_PREFIX}/redis-port" \
            --arg logGroup "$LOG_GROUP" \
            --arg region "$AWS_REGION" \
            '{
              family: $family,
              requiresCompatibilities: ["FARGATE"],
              networkMode: "awsvpc",
              cpu: "512",
              memory: "1024",
              executionRoleArn: $execRoleArn,
              taskRoleArn: $taskRoleArn,
              containerDefinitions: [{
                name: "todo-app",
                image: $image,
                portMappings: [{containerPort: 8080, protocol: "tcp"}],
                secrets: [
                  {name: "DB_USERNAME", valueFrom: ($dbSecretArn + ":username::")},
                  {name: "DB_PASSWORD", valueFrom: ($dbSecretArn + ":password::")},
                  {name: "DJANGO_SECRET_KEY", valueFrom: $djangoSecretArn},
                  {name: "DB_PROXY_ENDPOINT", valueFrom: $dbProxyArn},
                  {name: "DB_PORT", valueFrom: $dbPortArn},
                  {name: "DB_NAME", valueFrom: $dbNameArn},
                  {name: "REDIS_HOST", valueFrom: $redisHostArn},
                  {name: "REDIS_PORT", valueFrom: $redisPortArn}
                ],
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group": $logGroup,
                    "awslogs-region": $region,
                    "awslogs-stream-prefix": "todo-app"
                  }
                }
              }]
            }' > render/taskdef.json
          cp appspec.yaml render/appspec.yaml

      - name: Zip deploy artifact
        run: |
          cd render
          zip -j ../artifacts.zip taskdef.json appspec.yaml

      - name: Upload deploy artifact to S3
        env:
          ARTIFACT_BUCKET_NAME: ${{ secrets.ARTIFACT_BUCKET_NAME }}
        run: |
          aws s3 cp artifacts.zip "s3://${ARTIFACT_BUCKET_NAME}/deploy-artifacts/artifacts.zip"

      - name: Push image (triggers EventBridge -> CodePipeline)
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: docker push "$IMAGE_URI"
