<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}To-Do{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    form.create { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input[type=text] { flex: 1; padding: .5rem; }
    button { padding: .5rem .9rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid #8883; }
    li.completed span.title { text-decoration: line-through; opacity: .6; }
    .title { flex: 1; }
    .muted { opacity: .6; font-size: .85em; }
    .inline-form { display: inline; margin: 0; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
